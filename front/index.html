<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather AI Ultimate</title>
    <link rel="stylesheet" href="/front/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Weather AI Analytics</h1>
            <div class="mode-toggle-pane">
                <button onclick="switchMode('forecast')" id="btnForecast" class="mode-btn active">Live Forecast</button>
                <button onclick="switchMode('test')" id="btnTest" class="mode-btn">Algorithm Test</button>
                <button onclick="switchMode('future')" id="btnFuture" class="mode-btn">Future Oracle</button>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city...">
            <input type="date" id="dateInput" class="hidden">
            <button onclick="handleAction()" id="actionBtn" class="btn-analyze">Analyze</button>
        </div>

        <div id="resultArea" class="hidden">
            <h2 id="cityName" style="text-align: center;">City</h2>

            <div id="accuracyPanel" class="accuracy-container hidden">
                <span class="accuracy-text" id="accLabel">AI Prediction Accuracy</span>
                <span id="accuracyScore" class="accuracy-value">--%</span>
                <div class="dashed-separator"></div>
            </div>

            <div class="forecast-grid">
                <div class="forecast-card temp-card">
                    <div>Temperature</div>
                    <div class="val"><span id="resTemp">--</span>°C</div>
                    <div id="actTempBox" class="hidden actual-label">Actual: <span id="actTemp">--</span>°C</div>
                </div>
                <div class="forecast-card hum-card">
                    <div>Humidity</div>
                    <div class="val"><span id="resHum">--</span>%</div>
                </div>
                <div class="forecast-card rain-card">
                    <div>Rain</div>
                    <div class="val"><span id="resRain">--</span> mm</div>
                </div>
            </div>

            <div id="historySection" class="history-section">
                <h3>7-Day History Context</h3>
                <table>
                    <thead><tr><th>Date</th><th>Temp</th><th>Hum</th><th>Rain</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/front/script.js"></script>
</body>
</html>
